<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centriku bars</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #f3e8ff;
  color: #1f2937;
}

h1 {
  color: #4c1d95;
  font-size: 36px;
  text-align: center;
}

.noteikumi {
  background-color: #094a8b;
  color: #222222;
  padding: 12px;
  border-radius: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border: 2px dashed #94a3b8;
  background-color: #f8fafc;
  box-sizing: border-box;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
}

button {
  background-color: #245b91;
  color: #ffffff;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Centriku bars</h1>
<p>Draudzējies ar centrikiem un krāj punktus!</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Nospied pogu “Savākt punktu”, lai iegūtu punktu. Signāla skaņu vari noklausīties audio atskaņotājā.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.png" alt="Spēles varonis" width="128">
  <p>Nospied pogu, lai iegūtu punktu.</p>
  <p>Noklausies signāla skaņu, nospiežot audio atskaņotāja pogu.</p>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
